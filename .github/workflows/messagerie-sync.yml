name: Synchro boîte mail Messagerie (commercial@moorea.fr)

# 19/09/2026 — Demande d'Elinathan : la messagerie devait être "réactive à 200%, sans 0 attente,
# comme une vraie boîte mail". Avant, l'appli se connectait en direct à Gmail (IMAP) à chaque
# ouverture de la boîte de réception, d'où l'attente. Ici, exactement le même principe que pour
# la détection du BL NLT (voir nlt-bl-poll.yml) : un robot GitHub Actions se connecte tout seul,
# régulièrement, recopie les en-têtes (expéditeur, sujet, date, lu/pas lu, dossiers) de tous les
# dossiers/libellés Gmail sur 1 an d'historique dans Firebase, et l'appli n'a plus qu'à lire
# Firebase pour afficher la liste — instantané, comme le reste de l'appli. Vercel Cron n'est pas
# utilisé (plan Hobby limité à 1x/jour), d'où GitHub Actions (gratuit sur ce repo).
#
# Fréquence et plage horaire en semaine : alignées sur nlt-bl-poll.yml pour la même raison (Gmail
# avait bloqué le compte commercial@moorea.fr à cause de connexions IMAP trop fréquentes en
# 09/2026 — voir les commentaires dans api/messagerie.js). Toutes les 3 minutes, 6h-18h UTC, ce
# qui couvre 7h-19h à Paris en hiver et 8h-20h en été — les horaires où l'équipe travaille.
#
# Week-end (19/09/2026, suite) — Demande d'Elinathan : "je préfère qu'il bosse à fond le week-end
# quand personne est connecté". Personne ne consulte la messagerie le week-end, donc pas besoin
# de fraîcheur "instantanée" — en revanche c'est le bon moment pour rattraper plus vite
# l'historique d'un an (voir TAILLE_LOT_DECOUVERTE_WEEKEND dans api/messagerie.js, qui augmente
# automatiquement la taille de chaque lot le samedi/dimanche). On tourne donc H24 le week-end,
# mais à */5 (le minimum que GitHub Actions respecte pour un cron planifié) plutôt que */3 : une
# seule connexion IMAP à la fois de toute façon, comme en semaine, donc pas de risque de
# reblocage Gmail — juste plus de travail utile par connexion.
#
# Secrets requis (Settings → Secrets and variables → Actions, sur GitHub) :
#   APP_URL                  → déjà présent (utilisé par nlt-bl-poll.yml)
#   MESSAGERIE_SYNC_SECRET   → nouveau secret, à créer, même valeur que la variable d'environnement
#                              Vercel du même nom
# 21/09/2026 -- Le declenchement automatique GitHub Actions est desactive : GitHub ralentit /
# saute une bonne partie des executions programmees frequentes sur ce repo (verifie via
# l'API GitHub : seulement 5 executions en ~17h au lieu des ~200 attendues), ce qui faisait
# prendre du retard a "Messages envoyes". La synchro est maintenant declenchee par un service
# externe (cron-job.org, toutes les 5 min) qui appelle le meme endpoint. On garde
# workflow_dispatch pour pouvoir relancer une synchro a la main si besoin, et le schedule reste
# en commentaire ci-dessous si jamais on veut le reactiver un jour.
on:
  # schedule:
  #   - cron: "*/3 6-18 * * 1-5"
  #   - cron: "*/5 * * * 0,6"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Appelle l'endpoint de synchro de la messagerie
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/messagerie?action=sync&secret=${{ secrets.MESSAGERIE_SYNC_SECRET }}" \
            --fail-with-body \
            --max-time 55
